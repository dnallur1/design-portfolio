<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1110" role="img" aria-labelledby="title desc"><title id="title">Out of Reflection — a hand-drawn interaction journey</title><desc id="desc">Follow ten numbered stops: enter the room, read the instruction, notice obvious differences, click a reflected object, check the mismatch, confirm progress, explore finer details, reconsider the changing room, complete six discoveries, and replay or exit. Incorrect clicks preserve progress. The first three stages have two discoveries each.</desc><defs><filter id="paper"><feTurbulence type="fractalNoise" baseFrequency=".035" numOctaves="2" seed="12" result="noise"/><feDisplacementMap in="SourceGraphic" in2="noise" scale="1.2" xChannelSelector="R" yChannelSelector="G"/></filter><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="none" stroke="#88e6c2" stroke-width="2"/></marker></defs><rect width="1200" height="1110" rx="12" fill="#081b20"/><g font-family="'Comic Sans MS','Chalkboard SE',cursive" fill="#e7f3ee"><path d="M360 93Q357 390 360 759Q359 801 400 800L708 802Q751 801 750 759L752 163Q750 121 790 123L1040 120Q1082 119 1080 161L1078 982" fill="none" stroke="#88e6c2" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="360" cy="92" r="13" fill="#081b20" stroke="#88e6c2" stroke-width="4"/><circle cx="1078" cy="982" r="13" fill="#081b20" stroke="#88e6c2" stroke-width="4"/><text x="327" y="55" text-anchor="start" font-size="31" fill="#e7f3ee"><tspan x="327" dy="0">START</tspan></text><text x="980" y="1040" text-anchor="start" font-size="31" fill="#e7f3ee"><tspan x="980" dy="0">FINISH</tspan></text><path d="M39 117Q169.0 111 299 116L304 173.64L326 187.84L304 200.62L301 253Q169.0 259 36 255Z" transform="translate(6 7)" fill="#030f14" opacity=".9"/><path d="M39 117Q169.0 111 299 116L304 173.64L326 187.84L304 200.62L301 253Q169.0 259 36 255Z" fill="#18433d" stroke="#6cae9e" stroke-width="3.5" stroke-linejoin="round"/><text x="54" y="146" text-anchor="start" font-size="18" fill="#e7f3ee"><tspan x="54" dy="0" textLength="143.6" lengthAdjust="spacingAndGlyphs">ENTER THE ROOM</tspan></text><text x="54" y="177" text-anchor="start" font-size="17" fill="#e7f3ee"><tspan x="54" dy="0" textLength="230.0" lengthAdjust="spacingAndGlyphs">Room + blurred reflection.</tspan><tspan x="54" dy="26" textLength="203.5" lengthAdjust="spacingAndGlyphs">A flower appears only</tspan><tspan x="54" dy="26" textLength="174.4" lengthAdjust="spacingAndGlyphs">inside the mirror.</tspan></text><circle cx="360" cy="180" r="7" fill="#e7f3ee"/><text x="377" y="186" text-anchor="start" font-size="21" fill="#e7f3ee"><tspan x="377" dy="0">01</tspan></text><path d="M41 299Q171.0 293 301 298L306 338.0L328 348.0L306 357.0L303 393Q171.0 399 38 395Z" transform="translate(6 7)" fill="#030f14" opacity=".9"/><path d="M41 299Q171.0 293 301 298L306 338.0L328 348.0L306 357.0L303 393Q171.0 399 38 395Z" fill="#222d43" stroke="#6cae9e" stroke-width="3.5" stroke-linejoin="round"/><text x="56" y="328" text-anchor="start" font-size="18" fill="#e7f3ee"><tspan x="56" dy="0" textLength="133.4" lengthAdjust="spacingAndGlyphs">READ THE CLUE</tspan></text><text x="56" y="359" text-anchor="start" font-size="17" fill="#e7f3ee"><tspan x="56" dy="0" textLength="230.0" lengthAdjust="spacingAndGlyphs">“Click what doesn’t match.”</tspan></text><circle cx="360" cy="345" r="7" fill="#e7f3ee"/><text x="377" y="351" text-anchor="start" font-size="21" fill="#e7f3ee"><tspan x="377" dy="0">02</tspan></text><ellipse cx="166" cy="523" rx="135" ry="96" fill="#030f14" transform="translate(6 7)"/><ellipse cx="166" cy="523" rx="135" ry="96" fill="#17363b" stroke="#6cae9e" stroke-width="3.5"/><text x="166" y="489" text-anchor="middle" font-size="21" fill="#e7f3ee"><tspan x="166" dy="0">STAGE 1 — NOTICE</tspan></text><text x="166" y="520" text-anchor="middle" font-size="18" fill="#e7f3ee"><tspan x="166" dy="0">Find obvious mismatches.</tspan><tspan x="166" dy="26">Two discoveries before</tspan><tspan x="166" dy="26">the next stage.</tspan></text><circle cx="360" cy="520" r="7" fill="#e7f3ee"/><text x="377" y="526" text-anchor="start" font-size="21" fill="#e7f3ee"><tspan x="377" dy="0">03</tspan></text><path d="M39 653Q169.0 647 299 652L304 702.92L326 715.52L304 726.86L301 773Q169.0 779 36 775Z" transform="translate(6 7)" fill="#030f14" opacity=".9"/><path d="M39 653Q169.0 647 299 652L304 702.92L326 715.52L304 726.86L301 773Q169.0 779 36 775Z" fill="#173c45" stroke="#6cae9e" stroke-width="3.5" stroke-linejoin="round"/><text x="54" y="682" text-anchor="start" font-size="18" fill="#e7f3ee"><tspan x="54" dy="0" textLength="164.2" lengthAdjust="spacingAndGlyphs">MAKE A SELECTION</tspan></text><text x="54" y="713" text-anchor="start" font-size="17" fill="#e7f3ee"><tspan x="54" dy="0" textLength="145.3" lengthAdjust="spacingAndGlyphs">Click an object</tspan><tspan x="54" dy="26" textLength="174.4" lengthAdjust="spacingAndGlyphs">in the reflection.</tspan></text><circle cx="360" cy="710" r="7" fill="#e7f3ee"/><text x="377" y="716" text-anchor="start" font-size="21" fill="#e7f3ee"><tspan x="377" dy="0">04</tspan></text><path d="M405 889Q564.5 883 724 887L727 1046L580.75 1049L564.5 1067L548.25 1049L404 1048Z" transform="translate(6 7)" fill="#030f14" opacity=".9"/><path d="M405 889Q564.5 883 724 887L727 1046L580.75 1049L564.5 1067L548.25 1049L404 1048Z" fill="#17363b" stroke="#6cae9e" stroke-width="3.5" stroke-linejoin="round"/><text x="422" y="917" text-anchor="start" font-size="18" fill="#e7f3ee"><tspan x="422" dy="0" textLength="174.4" lengthAdjust="spacingAndGlyphs">DOES IT MISMATCH?</tspan></text><text x="422" y="948" text-anchor="start" font-size="17" fill="#e7f3ee"><tspan x="422" dy="0" textLength="285.0" lengthAdjust="spacingAndGlyphs">No → soft tap + ripple; retry.</tspan><tspan x="422" dy="26" textLength="285.0" lengthAdjust="spacingAndGlyphs">Yes → continue to confirmation.</tspan><tspan x="422" dy="26" textLength="213.2" lengthAdjust="spacingAndGlyphs">Earned progress stays.</tspan></text><circle cx="560" cy="800" r="7" fill="#e7f3ee"/><text x="578" y="782" text-anchor="start" font-size="21" fill="#e7f3ee"><tspan x="578" dy="0">05</tspan></text><path d="M560 812L560 878" stroke="#6cae9e" stroke-width="2" stroke-dasharray="4 5" fill="none"/><path d="M813 564Q934.0 559 1055 565L1058 734Q934.0 738 812 735L810 669.88L788 652.48L810 635.08Z" transform="translate(6 7)" fill="#030f14" opacity=".9"/><path d="M813 564Q934.0 559 1055 565L1058 734Q934.0 738 812 735L810 669.88L788 652.48L810 635.08Z" fill="#18433d" stroke="#6cae9e" stroke-width="3.5" stroke-linejoin="round"/><text x="830" y="594" text-anchor="start" font-size="18" fill="#e7f3ee"><tspan x="830" dy="0" textLength="164.2" lengthAdjust="spacingAndGlyphs">CONFIRM PROGRESS</tspan></text><text x="830" y="625" text-anchor="start" font-size="17" fill="#e7f3ee"><tspan x="830" dy="0" textLength="208.0" lengthAdjust="spacingAndGlyphs">Circle + chime confirm.</tspan><tspan x="830" dy="26" textLength="208.0" lengthAdjust="spacingAndGlyphs">Add progress; reduce blur.</tspan><tspan x="830" dy="26" textLength="208.0" lengthAdjust="spacingAndGlyphs">Change other mismatches.</tspan></text><circle cx="750" cy="650" r="7" fill="#e7f3ee"/><text x="712" y="656" text-anchor="start" font-size="21" fill="#e7f3ee"><tspan x="712" dy="0">06</tspan></text><path d="M430 357Q560.0 351 690 356L695 417.0L717 432.0L695 445.5L692 501Q560.0 507 427 503Z" transform="translate(6 7)" fill="#030f14" opacity=".9"/><path d="M430 357Q560.0 351 690 356L695 417.0L717 432.0L695 445.5L692 501Q560.0 507 427 503Z" fill="#222d43" stroke="#6cae9e" stroke-width="3.5" stroke-linejoin="round"/><text x="445" y="386" text-anchor="start" font-size="18" fill="#e7f3ee"><tspan x="445" dy="0" textLength="174.4" lengthAdjust="spacingAndGlyphs">STAGE 2 — EXPLORE</tspan></text><text x="445" y="417" text-anchor="start" font-size="17" fill="#e7f3ee"><tspan x="445" dy="0" textLength="164.7" lengthAdjust="spacingAndGlyphs">At 2 discoveries:</tspan><tspan x="445" dy="26" textLength="230.0" lengthAdjust="spacingAndGlyphs">finer details become clear.</tspan><tspan x="445" dy="26" textLength="230.0" lengthAdjust="spacingAndGlyphs">A vanished mismatch returns.</tspan></text><circle cx="750" cy="425" r="7" fill="#e7f3ee"/><text x="712" y="431" text-anchor="start" font-size="21" fill="#e7f3ee"><tspan x="712" dy="0">07</tspan></text><path d="M431 167Q561.0 161 691 166L696 227.84L718 243.04000000000002L696 256.72L693 313Q561.0 319 428 315Z" transform="translate(6 7)" fill="#030f14" opacity=".9"/><path d="M431 167Q561.0 161 691 166L696 227.84L718 243.04000000000002L696 256.72L693 313Q561.0 319 428 315Z" fill="#173c45" stroke="#6cae9e" stroke-width="3.5" stroke-linejoin="round"/><text x="446" y="196" text-anchor="start" font-size="18" fill="#e7f3ee"><tspan x="446" dy="0" textLength="143.6" lengthAdjust="spacingAndGlyphs">3 — RECONSIDER</tspan></text><text x="446" y="227" text-anchor="start" font-size="17" fill="#e7f3ee"><tspan x="446" dy="0" textLength="164.7" lengthAdjust="spacingAndGlyphs">At 4 discoveries:</tspan><tspan x="446" dy="26" textLength="230.0" lengthAdjust="spacingAndGlyphs">selections change the room.</tspan><tspan x="446" dy="26" textLength="213.2" lengthAdjust="spacingAndGlyphs">A real flower appears.</tspan></text><circle cx="750" cy="225" r="7" fill="#e7f3ee"/><text x="712" y="231" text-anchor="start" font-size="21" fill="#e7f3ee"><tspan x="712" dy="0">08</tspan></text><path d="M822 311Q924.5 305 1027 310L1032 380.24L1054 397.44L1032 412.92L1029 477Q924.5 483 819 479Z" transform="translate(6 7)" fill="#030f14" opacity=".9"/><path d="M822 311Q924.5 305 1027 310L1032 380.24L1054 397.44L1032 412.92L1029 477Q924.5 483 819 479Z" fill="#222d43" stroke="#6cae9e" stroke-width="3.5" stroke-linejoin="round"/><text x="837" y="340" text-anchor="start" font-size="18" fill="#e7f3ee"><tspan x="837" dy="0" textLength="133.4" lengthAdjust="spacingAndGlyphs">6 DISCOVERIES</tspan></text><text x="837" y="371" text-anchor="start" font-size="17" fill="#e7f3ee"><tspan x="837" dy="0" textLength="175.0" lengthAdjust="spacingAndGlyphs">Reflection fully clears.</tspan><tspan x="837" dy="26" textLength="175.0" lengthAdjust="spacingAndGlyphs">Both views now match.</tspan><tspan x="837" dy="26" textLength="175.0" lengthAdjust="spacingAndGlyphs">The room has changed.</tspan></text><circle cx="1080" cy="400" r="7" fill="#e7f3ee"/><text x="1098" y="406" text-anchor="start" font-size="21" fill="#e7f3ee"><tspan x="1098" dy="0">09</tspan></text><path d="M830 782Q927.5 776 1025 781L1030 830.66L1052 842.96L1030 854.03L1027 899Q927.5 905 827 901Z" transform="translate(6 7)" fill="#030f14" opacity=".9"/><path d="M830 782Q927.5 776 1025 781L1030 830.66L1052 842.96L1030 854.03L1027 899Q927.5 905 827 901Z" fill="#17363b" stroke="#6cae9e" stroke-width="3.5" stroke-linejoin="round"/><text x="845" y="811" text-anchor="start" font-size="18" fill="#e7f3ee"><tspan x="845" dy="0" textLength="143.6" lengthAdjust="spacingAndGlyphs">REPLAY OR EXIT</tspan></text><text x="845" y="842" text-anchor="start" font-size="17" fill="#e7f3ee"><tspan x="845" dy="0" textLength="126.0" lengthAdjust="spacingAndGlyphs">Changes stop.</tspan><tspan x="845" dy="26" textLength="164.7" lengthAdjust="spacingAndGlyphs">Ambience settles.</tspan></text><circle cx="1079" cy="840" r="7" fill="#e7f3ee"/><text x="1097" y="846" text-anchor="start" font-size="21" fill="#e7f3ee"><tspan x="1097" dy="0">10</tspan></text><path d="M447 646L447 566M443 572L447 566L451 572" stroke="#88e6c2" stroke-width="2" fill="none"/><text x="477" y="595" text-anchor="start" font-size="17" fill="#b8cfc9"><tspan x="477" dy="0">LOOK AGAIN</tspan></text><text x="477" y="620" text-anchor="start" font-size="16" fill="#b8cfc9"><tspan x="477" dy="0">after each discovery</tspan></text><path d="M432 681Q479 660 524 679" fill="none" stroke="#b5a0ee" stroke-width="2" stroke-dasharray="4 4"/><text x="480" y="70" text-anchor="start" font-size="16" fill="#b8cfc9"><tspan x="480" dy="0">ONE ROOM · THREE STAGES · SIX DISCOVERIES</tspan></text><text x="45" y="1090" text-anchor="start" font-size="18" fill="#b8cfc9"><tspan x="45" dy="0">Always keep one mismatch readable through the current blur.</tspan></text></g></svg>